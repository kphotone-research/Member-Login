<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kphotone Physician Enrollment</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<!-- Kphotone Theme -->
<style>
    body {
        font-family: 'Inter', sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 95%;
        max-width: 650px;
        margin: 40px auto;
        background: #ffffff;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        border-top: 6px solid #0057b4; /* Kphotone Blue */
    }

    h2 {
        margin-top: 0;
        color: #0057b4;
        font-weight: 600;
        text-align: center;
    }

    label {
        font-weight: 600;
        color: #333;
        display: block;
        margin-bottom: 6px;
    }

    input, select {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border: 1px solid #dfe3ea;
        border-radius: 8px;
        font-size: 15px;
    }

    input:focus, select:focus {
        border-color: #0057b4;
        outline: none;
    }

    button {
        width: 100%;
        padding: 14px;
        background: #0057b4;
        color: #fff;
        border: 0;
        border-radius: 8px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
    }

    button:hover {
        background: #003f82;
    }

    .hidden {
        display: none;
    }
</style>
</head>

<body>
<div class="container">
<h2>Physician Enrollment Form</h2>

<form id="enrollForm">

    <!-- FULL NAME -->
    <label>Full Name</label>
    <input type="text" id="full_name" required />

    <!-- EMAIL -->
    <label>Email</label>
    <input type="email" id="email" required />

    <!-- PHONE -->
    <label>Mobile Number</label>
    <input type="text" id="phone" required />

    <!-- COUNTRY -->
    <label>Country</label>
    <select id="country" required></select>

    <!-- STATE -->
    <label>State</label>
    <select id="state"></select>
    <input type="text" id="state_other" class="hidden" placeholder="Enter your state" />

    <!-- CITY -->
    <label>City</label>
    <select id="city"></select>
    <input type="text" id="city_other" class="hidden" placeholder="Enter your city" />

    <!-- SPECIALITY -->
    <label>Speciality</label>
    <select id="speciality"></select>
    <input type="text" id="speciality_other" class="hidden" placeholder="Enter your speciality" />

    <!-- MEDICAL LICENSE -->
    <label>Medical License / Registration Number</label>
    <input type="text" id="license" required />

    <!-- EXPERIENCE -->
    <label>Years of Experience</label>
    <input type="number" id="experience" min="0" required />

    <button type="submit">Submit Enrollment</button>
</form>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ------------------------------------------------------
   SUPABASE CONFIG
------------------------------------------------------- */
const SUPABASE_URL = "https://qbezfrqsojypxpmyblbc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiZXpmcnFzb2p5cHhwbXlibGJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwMjIxNDgsImV4cCI6MjA1OTU5ODE0OH0.FwfbMTlfPQ17OpoMXR3zDL13lwHwm3QlblV5dmHfEVc";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* ------------------------------------------------------
   COUNTRY, STATE, CITY DATA (Option 2)
------------------------------------------------------- */
const locationData = {
    "USA": {
        "states": {
            "California": ["Los Angeles", "San Diego", "San Jose", "San Francisco"],
            "Texas": ["Houston", "Dallas", "Austin", "San Antonio"],
            "New York": ["New York", "Buffalo", "Rochester"]
        }
    },
    "India": {
        "states": {
            "Maharashtra": ["Mumbai", "Pune", "Nagpur"],
            "Delhi": ["New Delhi"],
            "Karnataka": ["Bangalore", "Mysore"]
        }
    },
    "Canada": {
        "states": {
            "Ontario": ["Toronto", "Ottawa"],
            "British Columbia": ["Vancouver", "Victoria"]
        }
    },
    "UK": {
        "states": {
            "England": ["London", "Manchester", "Birmingham"],
            "Scotland": ["Edinburgh", "Glasgow"]
        }
    },
    "Australia": {
        "states": {
            "New South Wales": ["Sydney"],
            "Victoria": ["Melbourne"]
        }
    },
    "Germany": {
        "states": {
            "Bavaria": ["Munich"],
            "Berlin": ["Berlin"]
        }
    },
    "France": {
        "states": {
            "Île-de-France": ["Paris"]
        }
    },
    "Italy": {
        "states": {
            "Lombardy": ["Milan"],
            "Lazio": ["Rome"]
        }
    },
    "Spain": {
        "states": {
            "Madrid": ["Madrid"],
            "Catalonia": ["Barcelona"]
        }
    },
    "China": {
        "states": {
            "Beijing": ["Beijing"],
            "Shanghai": ["Shanghai"]
        }
    },
    "Japan": {
        "states": {
            "Tokyo": ["Tokyo"],
            "Osaka": ["Osaka"]
        }
    },
    "Brazil": {
        "states": {
            "São Paulo": ["São Paulo"],
            "Rio de Janeiro": ["Rio de Janeiro"]
        }
    },
    "Mexico": {
        "states": {
            "Mexico City": ["Mexico City"],
            "Jalisco": ["Guadalajara"]
        }
    },
    "South Africa": {
        "states": {
            "Gauteng": ["Johannesburg"],
            "Western Cape": ["Cape Town"]
        }
    },
    "UAE": {
        "states": {
            "Abu Dhabi": ["Abu Dhabi"],
            "Dubai": ["Dubai"]
        }
    },
    "Saudi Arabia": {
        "states": {
            "Riyadh Province": ["Riyadh"],
            "Makkah": ["Jeddah", "Makkah"]
        }
    },
    "Singapore": {
        "states": {
            "Singapore": ["Singapore"]
        }
    }
};


/* ------------------------------------------------------
   SPECIALITIES
------------------------------------------------------- */
const specialties = [
"Cardiologist", "Dermatologist", "Neurologist", "Oncologist", "Psychiatrist",
"General Physician", "Endocrinologist", "Nephrologist", "Surgeon",
"Orthopedic Surgeon", "Pulmonologist", "Gastroenterologist",
"Pediatrician", "Gynecologist", "ENT Specialist", "Ophthalmologist",
"Urologist", "Radiologist", "Pathologist", "Family Medicine",
"Emergency Medicine", "Internal Medicine", "Other"
];


/* ------------------------------------------------------
   Populate country dropdown
------------------------------------------------------- */
const countrySelect = document.getElementById("country");
const stateSelect = document.getElementById("state");
const citySelect = document.getElementById("city");

Object.keys(locationData).forEach(country => {
    let option = new Option(country, country);
    countrySelect.add(option);
});
countrySelect.add(new Option("Other", "Other"));


/* ------------------------------------------------------
   When country changes → load states
------------------------------------------------------- */
countrySelect.addEventListener("change", () => {
    stateSelect.innerHTML = "";
    citySelect.innerHTML = "";

    document.getElementById("state_other").classList.add("hidden");
    document.getElementById("city_other").classList.add("hidden");

    let country = countrySelect.value;

    if (country === "Other") {
        stateSelect.classList.add("hidden");
        document.getElementById("state_other").classList.remove("hidden");
        citySelect.classList.add("hidden");
        document.getElementById("city_other").classList.remove("hidden");
        return;
    }

    stateSelect.classList.remove("hidden");
    let states = Object.keys(locationData[country].states);

    states.forEach(state => stateSelect.add(new Option(state, state)));
    stateSelect.add(new Option("Other", "Other"));
});


/* ------------------------------------------------------
   When state changes → load cities
------------------------------------------------------- */
stateSelect.addEventListener("change", () => {
    citySelect.innerHTML = "";
    document.getElementById("city_other").classList.add("hidden");

    let country = countrySelect.value;
    let state = stateSelect.value;

    if (state === "Other") {
        citySelect.classList.add("hidden");
        document.getElementById("city_other").classList.remove("hidden");
        return;
    }

    citySelect.classList.remove("hidden");

    let cities = locationData[country].states[state];
    cities.forEach(city => citySelect.add(new Option(city, city)));
    citySelect.add(new Option("Other", "Other"));
});

citySelect.addEventListener("change", () => {
    if (citySelect.value === "Other") {
        document.getElementById("city_other").classList.remove("hidden");
    }
});


/* ------------------------------------------------------
   Populate specialties dropdown
------------------------------------------------------- */
const specialitySelect = document.getElementById("speciality");
specialties.forEach(s => specialitySelect.add(new Option(s, s)));

specialitySelect.addEventListener("change", () => {
    if (specialitySelect.value === "Other") {
        document.getElementById("speciality_other").classList.remove("hidden");
    } else {
        document.getElementById("speciality_other").classList.add("hidden");
    }
});


/* ------------------------------------------------------
   SUBMIT FORM
------------------------------------------------------- */
document.getElementById("enrollForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = {
        full_name: full_name.value,
        email: email.value,
        phone: phone.value,
        country: country.value,
        state: state.value === "Other" ? state_other.value : state.value,
        city: city.value === "Other" ? city_other.value : city.value,
        speciality: speciality.value === "Other" ? speciality_other.value : speciality.value,
        license: license.value,
        experience: experience.value
    };

    const { error } = await supabase.from("physician_enrollment").insert([payload]);

    if (error) {
        alert("Error: " + error.message);
    } else {
        alert("Thank you! Your enrollment has been submitted.");
        document.getElementById("enrollForm").reset();
    }
});
</script>

</body>
</html>
