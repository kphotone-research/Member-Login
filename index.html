<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kphotone Member Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Roboto', sans-serif; background:#f2f6fc; margin:0; padding:0; }
  .login-container { display:flex; justify-content:center; align-items:center; height:100vh; }
  .login-box { background:#fff; padding:40px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.1); width:90%; max-width:400px; text-align:center; }
  .login-box h2 { color:#003356; margin-bottom:20px; }
  .login-box input { width:100%; padding:12px; margin:10px 0; border-radius:6px; border:1px solid #ccc; font-size:1rem; }
  .login-box button { width:100%; padding:12px; margin:10px 0; border:none; border-radius:6px; background:#007bff; color:white; font-size:1rem; cursor:pointer; transition:0.3s; }
  .login-box button:hover { background:#005bb5; }
  #loginMsg { margin-top:12px; font-size:0.95rem; }
</style>
</head>
<body>

<div class="login-container">
  <div class="login-box">
    <h2>Kphotone Member Login / Sign Up</h2>
    <input type="email" id="email" placeholder="Enter your email" required>
    <input type="password" id="password" placeholder="Enter your password" required>
    <button id="loginBtn">Login</button>
    <button id="signupBtn">Sign Up</button>
    <p id="loginMsg"></p>
  </div>
</div>

<script>
const supabaseUrl = "https://qbezfrqsojypxpmyblbc.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiZXpmcnFzb2p5cHhwbXlibGJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwMjIxNDgsImV4cCI6MjA1OTU5ODE0OH0.FwfbMTlfPQ17OpoMXR3zDL13lwHwm3QlblV5dmHfEVc"; // replace with your key
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

const loginBtn = document.getElementById("loginBtn");
const signupBtn = document.getElementById("signupBtn");
const loginMsg = document.getElementById("loginMsg");

loginBtn.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) { alert("Enter email & password"); return; }
  loginMsg.textContent = "Logging in..."; loginMsg.style.color="#333";

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    loginMsg.textContent = "❌ " + error.message; loginMsg.style.color="red";
  } else {
    window.location.href = "dashboard.html";
  }
});

signupBtn.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) { alert("Enter email & password"); return; }
  loginMsg.textContent = "Creating account..."; loginMsg.style.color="#333";

  // Check if email already exists
  const { data: existingUser } = await supabase.auth.admin.listUsers();
  if (existingUser.find(u => u.email === email)) {
    loginMsg.textContent = "❌ Email already exists. Try login."; loginMsg.style.color="red";
    return;
  }

  const { data, error } = await supabase.auth.signUp({ email, password });
  if (error) {
    loginMsg.textContent = "❌ " + error.message; loginMsg.style.color="red";
  } else {
    // Insert into physicians table
    await supabase.from("physicians").insert([{ id: data.user.id, email, name:"", specialty:"" }]);
    loginMsg.textContent = "✅ Account created! Redirecting..."; loginMsg.style.color="green";
    setTimeout(()=> window.location.href = "dashboard.html", 1500);
  }
});
</script>

</body>
</html>
