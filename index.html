<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Join Kphotone Healthcare Network</title>
<style>
  :root{
    --kp-blue:#00306E;
    --kp-accent:#00A6FB;
    --muted:#6b7280;
    --bg:#f7fafc;
    --card:#fff;
    --radius:12px;
    --maxw:980px;
  }
  *{box-sizing:border-box}
  body{ background:var(--bg); font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin:0; padding:32px 20px; display:flex; justify-content:center; }
  .card{ width:100%; max-width:var(--maxw); background:var(--card); border-radius:var(--radius); box-shadow:0 12px 36px rgba(2,6,23,0.07); border-top:6px solid var(--kp-blue); padding:28px; }
  header{ text-align:center; margin-bottom:10px; }
  #kp-logo{ max-height:72px; object-fit:contain; display:block; margin:0 auto 10px auto; }
  h1{ margin:6px 0 4px; color:var(--kp-blue); font-size:22px; }
  p.lead{ margin:0 0 18px 0; color:var(--muted); }
  form{ display:grid; gap:12px; }
  label{ font-size:13px; color:#1f2937; display:block; margin-bottom:6px; }
  input[type="text"], input[type="email"], input[type="tel"], select, textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid #e6e9ee; font-size:14px; box-sizing:border-box;
  }
  textarea{ min-height:100px; resize:vertical; }
  .row{ display:flex; gap:12px; }
  .col{ flex:1; min-width:0; }
  .btn{ background:var(--kp-blue); color:#fff; padding:12px 16px; border-radius:10px; border:none; font-weight:600; cursor:pointer; }
  .small{ font-size:13px; color:var(--muted); }
  .success{ padding:12px; background:#ecfdf5; color:#065f46; border-radius:10px; margin-top:8px; }
  .error{ padding:12px; background:#fee2e2; color:#991b1b; border-radius:10px; margin-top:8px; }
  @media (max-width:760px){ .row{ flex-direction:column; } }
</style>
</head>
<body>
  <div class="card" role="main">
    <header>
      <img id="kp-logo" src="https://raw.githubusercontent.com/kphotone-research/Images-kphotone/main/Logo.png" alt="Kphotone logo">
      <h1>Join Kphotone Healthcare Network</h1>
      <p class="lead">Register to join our community of healthcare professionals for paid research and collaboration.</p>
    </header>

    <div id="messages" aria-live="polite"></div>

    <form id="enrollForm" autocomplete="on" novalidate>

      <!-- Personal -->
      <div class="row">
        <div class="col">
          <label for="full_name">Full Name *</label>
          <input id="full_name" name="full_name" type="text" required />
        </div>
        <div class="col">
          <label for="email">Email *</label>
          <input id="email" name="email" type="email" required />
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="phone">Mobile / WhatsApp *</label>
          <input id="phone" name="phone" type="tel" placeholder="+91..." required />
        </div>
        <div class="col">
          <label for="gender">Gender</label>
          <select id="gender" name="gender">
            <option value="">Prefer not to say</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <!-- Identification -->
      <label for="medical_license_number">Medical License / Registration ID *</label>
      <input id="medical_license_number" name="medical_license_number" type="text" required placeholder="NPI / NMC / GMC / DHA / etc." />

      <label for="registration_id">Other Identification (optional)</label>
      <input id="registration_id" name="registration_id" type="text" placeholder="State Council ID / License type" />

      <!-- Location -->
      <div class="row">
        <div class="col">
          <label for="country">Country *</label>
          <input id="country" name="country" type="text" placeholder="Enter country" required />
        </div>
        <div class="col">
          <label for="state">State / Province *</label>
          <input id="state" name="state" type="text" placeholder="Enter state / province" required />
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="city">City *</label>
          <input id="city" name="city" type="text" placeholder="Enter city" required />
        </div>
      </div>

      <!-- Professional -->
      <div class="row">
        <div class="col">
          <label for="specialty">Primary Specialty *</label>
          <!-- single-select searchable via datalist -->
          <input list="specialtiesList" id="specialty" name="specialty" placeholder="Type to search or choose..." autocomplete="off" required />
          <datalist id="specialtiesList">
            <!-- Medical & allied specialties (extended list) -->
            <option>Allied Health Professional</option>
            <option>Anesthesiologist</option>
            <option>Cardiologist</option>
            <option>Cardiac Surgeon</option>
            <option>Clinical Research Coordinator</option>
            <option>Clinical Psychologist</option>
            <option>Dermatologist</option>
            <option>Dermatology Nurse</option>
            <option>Emergency Medicine</option>
            <option>Endocrinologist</option>
            <option>ENT Specialist</option>
            <option>Family Physician</option>
            <option>General Practitioner</option>
            <option>Geriatrician</option>
            <option>Hematologist</option>
            <option>Hematology-Oncologist</option>
            <option>Immunologist</option>
            <option>Intensivist</option>
            <option>Internal Medicine</option>
            <option>Nephrologist</option>
            <option>Neurologist</option>
            <option>Neurosurgeon</option>
            <option>Nurse Practitioner</option>
            <option>Registered Nurse (RN)</option>
            <option>Clinical Nurse Specialist</option>
            <option>Nurse Anesthetist</option>
            <option>Obstetrician / Gynaecologist</option>
            <option>Oncologist</option>
            <option>Ophthalmologist</option>
            <option>Orthopedic Surgeon</option>
            <option>Orthoptist</option>
            <option>Otolaryngologist</option>
            <option>Palliative Care Specialist</option>
            <option>Pathologist</option>
            <option>Pharmacist</option>
            <option>Pharmacy Technician</option>
            <option>Pediatrician</option>
            <option>Pediatric Nurse</option>
            <option>Physiotherapist</option>
            <option>Physical Therapist Assistant</option>
            <option>Plastic Surgeon</option>
            <option>Primary Care Nurse</option>
            <option>Psychiatrist</option>
            <option>Radiologist</option>
            <option>Radiation Oncologist</option>
            <option>Radiographer</option>
            <option>Respiratory Therapist</option>
            <option>Research Scientist</option>
            <option>Rehabilitation Specialist</option>
            <option>Surgical Nurse</option>
            <option>Surgeon</option>
            <option>Speech and Language Therapist</option>
            <option>Specialist Nurse</option>
            <option>Trauma Surgeon</option>
            <option>Clinical Pharmacologist</option>
            <option>Other (please specify)</option>
          </datalist>
        </div>
        <div class="col">
          <label for="subspecialty">Sub-specialty (optional)</label>
          <input id="subspecialty" name="subspecialty" type="text" />
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="experience_years">Years of Experience *</label>
          <select id="experience_years" name="experience_years" required>
            <option value="">Select</option>
            <option value="<1">&lt;1</option>
            <option value="1-3">1–3</option>
            <option value="4-7">4–7</option>
            <option value="8-12">8–12</option>
            <option value="13+">13+</option>
          </select>
        </div>
        <div class="col">
          <label for="patients_month">Patients per month</label>
          <select id="patients_month" name="patients_month">
            <option value="">Select</option>
            <option>0–50</option>
            <option>51–100</option>
            <option>101–200</option>
            <option>201–300</option>
            <option>301+</option>
          </select>
        </div>
      </div>

      <label for="practice_type">Practice Type</label>
      <select id="practice_type" name="practice_type">
        <option value="">Select</option>
        <option>Government Hospital</option>
        <option>Private Clinic</option>
        <option>Corporate Hospital</option>
        <option>Teaching Hospital</option>
        <option>Research Institute</option>
        <option>Other</option>
      </select>

      <div class="row">
        <div class="col">
          <label for="willing_for_surveys">Willing to participate in paid surveys?</label>
          <select id="willing_for_surveys" name="willing_for_surveys">
            <option value="">Select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
        <div class="col">
          <label for="contact_pref">Preferred contact method</label>
          <select id="contact_pref" name="contact_pref">
            <option value="">Select</option>
            <option>Email</option>
            <option>WhatsApp</option>
            <option>Phone</option>
            <option>SMS</option>
          </select>
        </div>
      </div>

      <label for="notes">Notes (optional)</label>
      <textarea id="notes" name="notes" placeholder="Any additional details..."></textarea>

      <label style="display:flex;gap:8px;align-items:center;">
        <input id="consent" name="consent" type="checkbox" required />
        <span class="small">I confirm I am a licensed healthcare professional and agree to be contacted for paid surveys. (Required)</span>
      </label>

      <div style="display:flex;gap:12px;align-items:center;margin-top:8px;">
        <button class="btn" type="submit">Submit Enrollment</button>
        <div class="small" style="margin-left:8px;">Data will be recorded securely in Kphotone research server.</div>
      </div>

    </form>

    <p class="small" style="margin-top:12px;">Questions? Contact: support@kphotone.com</p>
  </div>

<script>
  // Final Google Web App URL (confirmed)
  const GOOGLE_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwYLEFLreMoNDYpR5pUdf2apaSg1b1IHWFIcdAWiLr7G9OSIsQDXQS0VTYIMFytHXBIIw/exec";

  const form = document.getElementById("enrollForm");
  const messagesEl = document.getElementById("messages");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    messagesEl.innerHTML = "";

    // read values
    const payload = {
      full_name: document.getElementById("full_name").value.trim(),
      email: document.getElementById("email").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      gender: document.getElementById("gender").value,
      medical_license_number: document.getElementById("medical_license_number").value.trim(),
      registration_id: document.getElementById("registration_id").value.trim(),
      country: document.getElementById("country").value.trim(),
      state: document.getElementById("state").value.trim(),
      city: document.getElementById("city").value.trim(),
      specialty: document.getElementById("specialty").value.trim(),
      subspecialty: document.getElementById("subspecialty").value.trim(),
      experience_years: document.getElementById("experience_years").value,
      patient_volume: document.getElementById("patients_month").value,
      practice_type: document.getElementById("practice_type").value,
      willing_for_surveys: document.getElementById("willing_for_surveys").value,
      contact_pref: document.getElementById("contact_pref").value,
      notes: document.getElementById("notes").value.trim(),
      consent: document.getElementById("consent").checked ? "Yes" : "No"
    };

    // basic validation
    if(!payload.full_name || !payload.email || !payload.phone || !payload.medical_license_number || !payload.country || !payload.state || !payload.city || !payload.specialty || !payload.experience_years || payload.consent === "No"){
      messagesEl.innerHTML = '<div class="error">Please fill required fields and confirm consent.</div>';
      return;
    }

    // show submitting message
    messagesEl.innerHTML = "<div class='success'>Submitting...</div>";
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = "Submitting...";

    // send to Google Apps Script (no-cors)
    fetch(GOOGLE_WEBAPP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    // show thank-you and redirect — cannot read response with no-cors
    messagesEl.innerHTML = `<div class="success"><strong>Thank you for enrolling!</strong><br/>We have received your details. Redirecting to Kphotone...</div>`;
    form.reset();

    setTimeout(() => {
      window.location.href = "https://www.kphotone.com";
    }, 3000);
  });
</script>

</body>
</html>
