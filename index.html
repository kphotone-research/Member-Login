<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kphotone Research | Member Login</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Roboto', sans-serif; margin:0; padding:0; background:#f9f9f9; color:#003356; display:flex; justify-content:center; align-items:center; height:100vh; }
  .login-box { background:#fff; padding:40px; border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.2); width:100%; max-width:400px; text-align:center; }
  h2 { color:#003356; margin-bottom:20px; }
  input { width:100%; padding:12px; margin:10px 0; border-radius:6px; border:1px solid #ccc; font-size:1rem; box-sizing:border-box; }
  button { width:100%; padding:12px; margin:10px 0; border:none; border-radius:6px; font-size:1rem; cursor:pointer; background:#007bff; color:#fff; transition:0.3s; }
  button:hover { background:#005bb5; }
  #message { margin-top:12px; font-size:0.95rem; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
</head>
<body>

<div class="login-box">
  <h2>Physician Login / Sign Up</h2>
  <input type="email" id="email" placeholder="Enter your email" required />
  <input type="password" id="password" placeholder="Enter your password" required />
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
  <p id="message"></p>
</div>

<script>
  const supabaseUrl = "https://qbezfrqsojypxpmyblbc.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiZXpmcnFzb2p5cHhwbXlibGJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwMjIxNDgsImV4cCI6MjA1OTU5ODE0OH0.FwfbMTlfPQ17OpoMXR3zDL13lwHwm3QlblV5dmHfEVc";
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  const loginBtn = document.getElementById("loginBtn");
  const signupBtn = document.getElementById("signupBtn");
  const messageEl = document.getElementById("message");

  loginBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    if (!email || !password) { messageEl.textContent="Enter email & password!"; messageEl.style.color="red"; return; }

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { messageEl.textContent = error.message; messageEl.style.color = "red"; return; }

    messageEl.textContent = "Login successful! Redirecting..."; messageEl.style.color = "green";
    window.location.href = `dashboard.html?user=${data.user.id}`;
  });

  signupBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    if (!email || !password) { messageEl.textContent="Enter email & password!"; messageEl.style.color="red"; return; }

    const { data, error } = await supabase.auth.signUp({ email, password });
    if (error) { messageEl.textContent = error.message; messageEl.style.color="red"; return; }

    // Insert new physician row if not exists
    await supabase.from("physicians").upsert({ id: data.user.id, email, name: "", specialty: "" });

    messageEl.textContent = "Sign up successful! Redirecting..."; messageEl.style.color="green";
    window.location.href = `dashboard.html?user=${data.user.id}`;
  });
</script>

</body>
</html>
