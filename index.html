<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Physician Enrollment - KPhotone</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f7f9fc;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        border-top: 6px solid #0058A3;
    }
    h2 {
        text-align: center;
        color: #0058A3;
        margin-bottom: 20px;
    }
    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        color: #003b6f;
    }
    input, select, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 15px;
    }
    textarea { height: 80px; }
    button {
        width: 100%;
        margin-top: 25px;
        padding: 12px;
        background: #0058A3;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }
    button:hover {
        background: #004b8a;
    }
    .success {
        background: #d1f8d1;
        padding: 12px;
        border-left: 5px solid #2e8b57;
        margin-top: 20px;
    }
</style>
</head>

<body>
<div class="container">
    <h2>Physician Enrollment Form</h2>

    <form id="enrollForm">

        <label>Full Name</label>
        <input id="full_name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Phone</label>
        <input id="phone">

        <label>Gender</label>
        <select id="gender">
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Medical License Number</label>
        <input id="medical_license_number">

        <label>Registration ID</label>
        <input id="registration_id">

        <label>Country</label>
        <input id="country" placeholder="Enter Country">

        <label>State</label>
        <input id="state" placeholder="Enter State">

        <label>City</label>
        <input id="city" placeholder="Enter City">

        <label>Specialty</label>
        <select id="specialty" required>
            <option value="">Select</option>
            <option>Dermatologist</option>
            <option>MOH Dermatologist</option>
            <option>Surgeon</option>
            <option>Radiation Oncologist</option>
            <option>Hematology-Oncologist</option>
            <option>Oncologist</option>
            <option>General Physician</option>
            <option>Internal Medicine</option>
            <option>Other</option>
        </select>

        <label>Subspecialty</label>
        <input id="subspecialty">

        <label>Years of Experience</label>
        <input id="experience_years" type="number">

        <label>Avg. Monthly Patient Volume</label>
        <input id="patient_volume" type="number">

        <label>Practice Type</label>
        <select id="practice_type">
            <option>Private Clinic</option>
            <option>Government Hospital</option>
            <option>Corporate Hospital</option>
            <option>Telemedicine</option>
            <option>Other</option>
        </select>

        <label>Willing to Participate in Surveys?</label>
        <select id="willing_for_surveys">
            <option>Yes</option>
            <option>No</option>
        </select>

        <label>Preferred Contact Method</label>
        <select id="contact_pref">
            <option>Email</option>
            <option>Phone</option>
            <option>WhatsApp</option>
        </select>

        <label>Notes (Optional)</label>
        <textarea id="notes"></textarea>

        <label>
            <input type="checkbox" id="consent" required>
            I agree to be contacted for research purposes.
        </label>

        <button type="submit">Submit Enrollment</button>

        <div id="messages"></div>

    </form>
</div>

<script>
    const form = document.getElementById("enrollForm");
    const messagesEl = document.getElementById("messages");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const payload = {
            full_name: document.getElementById("full_name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            gender: document.getElementById("gender").value,
            medical_license_number: document.getElementById("medical_license_number").value,
            registration_id: document.getElementById("registration_id").value,
            country: document.getElementById("country").value,
            state: document.getElementById("state").value,
            city: document.getElementById("city").value,
            specialty: document.getElementById("specialty").value,
            subspecialty: document.getElementById("subspecialty").value,
            experience_years: document.getElementById("experience_years").value,
            patient_volume: document.getElementById("patient_volume").value,
            practice_type: document.getElementById("practice_type").value,
            willing_for_surveys: document.getElementById("willing_for_surveys").value,
            contact_pref: document.getElementById("contact_pref").value,
            notes: document.getElementById("notes").value,
            consent: document.getElementById("consent").checked ? "Yes" : "No"
        };

        messagesEl.innerHTML = "Submitting your information...";

        fetch("https://script.google.com/macros/s/AKfycbwYLEFLreMoNDYpR5pUdf2apaSg1b1IHWFIcdAWiLr7G9OSIsQDXQS0VTYIMFytHXBIIw/exec", {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        messagesEl.innerHTML = `
            <div class="success">
                Thank you! Your enrollment has been successfully recorded.<br>
                You will now be redirected to our website.
            </div>
        `;

        form.reset();

        setTimeout(() => {
            window.location.href = "https://www.kphotone.com";
        }, 3000);
    });
</script>

</body>
</html>
