<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kphotone Research | Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Roboto', sans-serif; margin:0; padding:0; background:#f9f9f9; color:#003356; }
  header { background:#007bff; color:#fff; padding:20px; text-align:center; font-size:1.5rem; font-weight:500; }
  .container { max-width:1200px; margin:20px auto; padding:20px; background:#fff; border-radius:12px; box-shadow:0 8px 16px rgba(0,0,0,0.1); }
  h2 { margin-bottom:20px; }
  table { width:100%; border-collapse:collapse; margin-top:20px; }
  th, td { border:1px solid #ccc; padding:12px; text-align:left; }
  th { background:#f2f6fc; }
  tr:nth-child(even) { background:#f9f9f9; }
  .reward { color:green; font-weight:500; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
</head>
<body>

<header>Kphotone Research | Dashboard</header>
<div class="container">
  <h2>Participation History</h2>
  <table>
    <thead>
      <tr>
        <th>Project Number</th>
        <th>Project Title</th>
        <th>Status</th>
        <th>Honorarium (USD)</th>
        <th>Completion Date</th>
      </tr>
    </thead>
    <tbody id="historyTable">
      <tr><td colspan="5">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
const supabaseUrl = "https://qbezfrqsojypxpmyblbc.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiZXpmcnFzb2p5cHhwbXlibGJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwMjIxNDgsImV4cCI6MjA1OTU5ODE0OH0.FwfbMTlfPQ17OpoMXR3zDL13lwHwm3QlblV5dmHfEVc";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

async function loadHistory() {
  const params = new URLSearchParams(window.location.search);
  const userId = params.get("user");
  if(!userId) return alert("User not found!");

  // Check if physician exists
  const { data: physician } = await supabase.from("physicians").select("*").eq("id", userId).single();
  if(!physician) { document.getElementById("historyTable").innerHTML = "<tr><td colspan='5'>No record found. Welcome!</td></tr>"; return; }

  const { data, error } = await supabase.from("participation_history").select("*").eq("physician_id", userId).order("created_at", {ascending:false});
  if(error) return alert(error.message);

  const tbody = document.getElementById("historyTable");
  if(!data.length) {
    tbody.innerHTML = "<tr><td colspan='5'>No participation history yet.</td></tr>";
  } else {
    tbody.innerHTML = data.map(row => `<tr>
      <td>${row.project_number || ""}</td>
      <td>${row.project_title || ""}</td>
      <td>${row.status || ""}</td>
      <td class="reward">${row.honorarium || 0}</td>
      <td>${row.completion_date ? new Date(row.completion_date).toLocaleDateString() : ""}</td>
    </tr>`).join("");
  }
}

loadHistory();
</script>

</body>
</html>
